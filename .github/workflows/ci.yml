name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

# Droits minimaux par défaut : lecture seule. Seul le job `publish` reçoit `packages: write`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodbridge
          POSTGRES_PASSWORD: foodbridge # base jetable du runner, pas un secret
          POSTGRES_DB: foodbridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodbridge -d foodbridge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://foodbridge:foodbridge@localhost:5432/foodbridge_test
      TEST_DATABASE_URL: postgresql+psycopg://foodbridge:foodbridge@localhost:5432/foodbridge_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations (application et absence de dérive)
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (PostgreSQL réel)
        run: pytest -q

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  images:
    name: Image ${{ matrix.service }} (build, contrôles, scan)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            max_mb: 200
          - service: frontend
            max_mb: 100
    steps:
      - uses: actions/checkout@v7

      - name: Nommer l'image (le nom doit être en minuscules)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/foodbridge-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Construire l'image (taguée avec le SHA du commit)
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            "./${{ matrix.service }}"

      - name: Contrôles (taille, utilisateur non-root)
        env:
          MAX_MB: ${{ matrix.max_mb }}
        run: |
          size_mb=$(( $(docker image inspect "${IMAGE}:${GITHUB_SHA}" --format '{{.Size}}') / 1000000 ))
          user=$(docker image inspect "${IMAGE}:${GITHUB_SHA}" --format '{{.Config.User}}')
          {
            echo "### Image ${{ matrix.service }}"
            echo "- Taille : **${size_mb} Mo** (limite ${MAX_MB} Mo)"
            echo "- Utilisateur : \`${user:-root}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt "$MAX_MB" ]; then
            echo "::error::Image trop lourde : ${size_mb} Mo > ${MAX_MB} Mo"; exit 1
          fi
          case "${user:-root}" in
            root|0|0:*) echo "::error::L'image tourne en root"; exit 1 ;;
          esac

      # Seule action tierce du pipeline. Épinglée par SHA de commit complet (v0.35.0, version
      # publiée en "release immuable"), jamais par tag : voir docs/ci-cd.md, incident du 19 mars 2026.
      - name: Scan de vulnérabilités (Trivy, échec sur CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          # Miroir de secours si le registre GHCR limite le téléchargement de la base (TOOMANYREQUESTS)
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.service }}.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Rapport Trivy (résumé)
        if: always()
        run: |
          [ -f "trivy-${{ matrix.service }}.txt" ] && cat "trivy-${{ matrix.service }}.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Conserver le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          if-no-files-found: ignore
          retention-days: 30

      # Ce qui sera publié est exactement ce qui vient d'être scanné : on transmet l'image, on ne la reconstruit pas.
      - name: Archiver l'image pour la publication
        if: github.event_name == 'push'
        run: docker save "${IMAGE}:${GITHUB_SHA}" | gzip > "image-${{ matrix.service }}.tar.gz"

      - name: Transmettre l'image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publier ${{ matrix.service }} sur GHCR
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # unique job autorisé à écrire sur GHCR ; n'exécute aucune action tierce
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}

      - name: Charger l'image scannée
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/foodbridge-${{ matrix.service }}" >> "$GITHUB_ENV"
          gunzip -c "image-${{ matrix.service }}.tar.gz" | docker load

      - name: Se connecter à GHCR (jeton éphémère du workflow, aucun mot de passe stocké)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pousser les tags
        run: |
          tags=("${GITHUB_SHA}")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags+=("${GITHUB_REF_NAME#v}"); else tags+=("latest"); fi
          for t in "${tags[@]}"; do
            docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
          echo "- \`${IMAGE}\` : ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"

  # Un seul contrôle à rendre obligatoire dans la protection de branche (les noms de matrice changent).
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, frontend, images]
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que tout est vert
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "::error::Un job a échoué ou a été ignoré"; exit 1; }; done
